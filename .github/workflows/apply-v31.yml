name: Apply TN-SST v3.1-rc.1 release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and expand release payload
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.v31smallpart-*' > /dev/null; then
            echo 'No staged v3.1 payload.'
            exit 0
          fi
          cat .v31smallpart-* | base64 --decode > .v31small-release.tar.xz
          echo 'df1676ce3fda442c28b41c57ee91f1e9c538890645e4e0dac8ad5ef3dff82101  .v31small-release.tar.xz' | sha256sum --check
          tar -tJf .v31small-release.tar.xz > /dev/null
          tar -xJf .v31small-release.tar.xz
          rm -f .v31small-release.tar.xz .v31smallpart-* .v31part-*
          rm -f .github/workflows/apply-v31.yml

      - name: Commit published release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Publish TN-SST v3.1-rc.1 with lessons 3 and 4'
          git push origin HEAD:${{ github.head_ref }}
