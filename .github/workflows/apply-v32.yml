name: Apply TN-SST v3.2-rc.1 release

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify and expand v3.2 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .v32payload.part-* | base64 --decode > .v32payload.tar.xz
          echo "a3f8da7c46b41e8b4b32aff587e21bcbc4961b60d736ed96e71c4d7612aabecb  .v32payload.tar.xz" | sha256sum --check
          tar -tJf .v32payload.tar.xz > /dev/null
          tar -xJf .v32payload.tar.xz
          rm -f .v32payload.tar.xz .v32payload.part-*

      - name: Apply v3.2 release patch
        run: node scripts/apply-v32.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release
        run: npm test

      - name: Commit published release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish TN-SST v3.2-rc.1"
          git push origin HEAD:${{ github.head_ref }}
