name: Apply v3.5 lessons 9 and 10

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - main
    paths:
      - '.v35payload.ready'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v3.5-rc.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and test release
        shell: bash
        run: |
          set -uo pipefail
          status=0
          cat .v35payload.part-* | base64 --decode > /tmp/v35-payload.tar.xz || status=$?
          if [ "$status" -eq 0 ]; then
            echo "0c240bc18014a303e3df308881366337f6ec6a6c51bdedf62cdbb967e0cdd69c  /tmp/v35-payload.tar.xz" | sha256sum -c - || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            tar -xJf /tmp/v35-payload.tar.xz || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm ci --ignore-scripts || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm test 2>&1 | tee /tmp/v35-test.log
            status=${PIPESTATUS[0]}
          else
            echo "Preparation failed before npm test (status=$status)" | tee /tmp/v35-test.log
          fi
          echo "$status" > /tmp/v35-status
          exit 0

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v35-test-log
          path: /tmp/v35-test.log
          if-no-files-found: error

      - name: Enforce test gate
        shell: bash
        run: test "$(cat /tmp/v35-status)" = "0"

      - name: Commit clean release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          rm -f .v35payload.part-* .v35payload.ready .v35snapshot.trigger
          rm -f .github/workflows/snapshot-v35.yml .github/workflows/apply-v35.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes to commit"
            exit 0
          fi
          if git ls-files | grep -E '(^|/)node_modules/|\.log$|\.v35payload|\.v35snapshot' ; then
            echo "Generated or transfer files would be committed" >&2
            exit 1
          fi
          git commit -m "Publish TN-SST v3.5-rc.1 lessons 9 and 10"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
