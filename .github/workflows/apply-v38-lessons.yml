name: Apply v3.8 lessons 15 and 16

on:
  push:
    branches:
      - release/v3.8-rc.1
    paths:
      - '.v38payload.ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v3.8-rc.1
          fetch-depth: 0

      - name: Rebuild and verify release payload
        run: |
          cat .v38payload.part-* > /tmp/v38-release.b64
          base64 -d /tmp/v38-release.b64 > /tmp/v38-release.tar.gz
          echo '113b4c2146131858af1f3febf33e44310cf6eea8b928e6c7435cc8ebc7918f3e  /tmp/v38-release.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v38-release.tar.gz

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full validation
        run: npm test | tee /tmp/v38-test.log

      - name: Remove transfer machinery
        run: |
          rm -rf node_modules
          rm -f .v38payload.part-* .v38payload.ready
          rm -f .github/workflows/apply-v38-lessons.yml

      - name: Verify final changed paths
        run: |
          git add -A
          git diff --cached --check origin/main
          git diff --cached --name-only origin/main -- | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          APPROVED_RULES.md
          LANGUAGE_CHECK.md
          README.md
          curriculum-v38.js
          index.html
          lesson15-v38.js
          lesson16-v38.js
          manifest-v38.webmanifest
          package-lock.json
          package.json
          sw.js
          tests/dom-v30.cjs
          tests/validate-v30.mjs
          EOF
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: v38-test-log
          path: /tmp/v38-test.log
          if-no-files-found: error

      - name: Commit verified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add lessons 15 and 16'
          git push origin HEAD:release/v3.8-rc.1
