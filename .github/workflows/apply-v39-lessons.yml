name: Apply v3.9 lessons 17 and 18

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.v39payload.ready'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v3.9-rc.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild and verify release payload
        run: |
          cat .v39payload.part-* > /tmp/v39-release.b64
          base64 -d /tmp/v39-release.b64 > /tmp/v39-release.tar.gz
          echo '23836e5a6efc2406276569e9cccc0bdac9445cd99d96a8a42928ae17ef26914b  /tmp/v39-release.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v39-release.tar.gz

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full validation
        run: npm test | tee /tmp/v39-test.log

      - name: Clean transfer files
        run: |
          rm -rf node_modules
          rm -f .v39payload.part-* .v39payload.ready
          rm -f .github/workflows/apply-v39-lessons.yml

      - name: Verify final changed paths
        run: |
          git add -A
          git diff --cached --check origin/main
          git diff --cached --name-only origin/main -- | sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          APPROVED_RULES.md
          LANGUAGE_CHECK.md
          README.md
          curriculum-v39.js
          index.html
          lesson17-v39.js
          lesson18-v39.js
          manifest-v39.webmanifest
          package-lock.json
          package.json
          sw.js
          tests/dom-v30.cjs
          tests/validate-v30.mjs
          EOF
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

      - name: Upload validation log
        uses: actions/upload-artifact@v4
        with:
          name: v39-test-log
          path: /tmp/v39-test.log
          if-no-files-found: error

      - name: Commit verified release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add lessons 17 and 18'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
