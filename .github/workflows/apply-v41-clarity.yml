name: Apply v4.1 beginner clarity

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.v41patch.ready'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v4.1-rc.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild, verify, and apply patch
        run: |
          cat .v41patch.part-* > /tmp/v41.patch.b64
          base64 -d /tmp/v41.patch.b64 > /tmp/v41.patch.gz
          echo 'fec4e48f126acb3312994ee910e321362211187fa515b8a151fa96c8ac31c7fc  /tmp/v41.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v41.patch.gz > /tmp/v41.patch
          git apply --check /tmp/v41.patch
          git apply /tmp/v41.patch

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete validation
        run: npm test | tee /tmp/v41-test.log

      - name: Save exact validation output
        run: |
          cp /tmp/v41-test.log .v41test.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .v41test.txt
          git commit -m 'Capture v4.1 validation output'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1

      - name: Remove temporary transfer files
        run: |
          rm -rf node_modules
          rm -f .v41patch.part-* .v41patch.ready .v41status.txt .v41pr.txt .v41test.txt
          rm -f .github/workflows/apply-v41-clarity.yml

      - name: Verify final release paths
        run: |
          git add -A
          git diff --cached --check origin/main
          git diff --cached --name-only origin/main -- | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          APPROVED_RULES.md
          BEGINNER_CLARITY_AUDIT.md
          LANGUAGE_CHECK.md
          README.md
          app-v28.js
          clarity-v41.js
          curriculum-v41.js
          index.html
          manifest-v41.webmanifest
          package-lock.json
          package.json
          styles-v28.css
          sw.js
          tests/dom-v30.cjs
          tests/validate-v30.mjs
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified v4.1 release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve beginner clarity across all twenty lessons'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
