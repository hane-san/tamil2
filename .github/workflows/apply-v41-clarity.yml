name: Apply v4.1 beginner clarity

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.v41patch.ready'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v4.1-rc.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild, verify, and apply patch
        run: |
          cat .v41patch.part-* > /tmp/v41.patch.b64
          base64 -d /tmp/v41.patch.b64 > /tmp/v41.patch.gz
          echo 'fec4e48f126acb3312994ee910e321362211187fa515b8a151fa96c8ac31c7fc  /tmp/v41.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v41.patch.gz > /tmp/v41.patch
          git apply --check /tmp/v41.patch
          git apply /tmp/v41.patch

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture complete validation diagnostic
        run: |
          set +e
          npm test > /tmp/v41-test.txt 2>&1
          status=$?
          set -e
          {
            echo "exit_status=$status"
            cat /tmp/v41-test.txt
          } > .v41diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .v41diagnostic.txt
          git commit -m 'Capture complete v4.1 validation diagnostic'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 1
