name: Deploy TN-SST v3.0-rc.1

on:
  push:
    branches:
      - main
    paths:
      - '.deploy-v30.tar.gz'
      - '.github/workflows/deploy-v30.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand approved v3.0-rc.1 package
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .deploy-v30.tar.gz
          rm -f .deploy-v30.tar.gz
          rm -f .github/workflows/deploy-v30.yml

      - name: Commit published files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish TN-SST v3.0-rc.1"
          git push origin HEAD:main
