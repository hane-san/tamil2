name: Finalize v3.7 audit records

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.v37docs.ready'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v3.7-rc.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Update exact audit totals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('LANGUAGE_CHECK.md')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '現在の公開130項目': '現在の公開286項目',
            '| 第12課 | 10 | 8 | 5 |\n\n全公開スキーマ項目：245。': '| 第12課 | 10 | 8 | 5 |\n| 第13課 | 11 | 8 | 5 |\n| 第14課 | 12 | 10 | 5 |\n\n全公開スキーマ項目：286。',
            'v3.6 validation passed: 10166 assertions': 'v3.7 validation passed: 11844 assertions',
            '- 245 public data entries linted': '- 286 public data entries linted',
            '- PART 0 + lessons 1–12 only': '- PART 0 + lessons 1–14 only',
            '- PART 0＋第1〜12課だけをナビ・印刷対象にする': '- PART 0＋第1〜14課だけをナビ・印刷対象にする',
            '- 全12課に3文の短い読み取りを表示する': '- 全14課に3文の短い読み取りを表示する',
            '- 全12課に「持ち帰る3点」と初心者向け6段階解説を表示する': '- 全14課に「持ち帰る3点」と初心者向け6段階解説を表示する',
            'DOM validation passed: 65 assertions': 'DOM validation passed: 73 assertions',
            '- PART 0 + 12 lessons, beginner explanations, critical quizzes, short readings, and 216-character table render': '- PART 0 + 14 lessons, four-step practice UI, beginner explanations, critical quizzes, short readings, and 216-character table render',
            '版は `v3.6-rc.1` とする。': '版は `v3.7-rc.1` とする。',
          }
          for old, new in replacements.items():
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'expected one occurrence, got {count}: {old}')
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary report machinery
        run: |
          rm -f .v37report.ready .v37docs.ready .v37test-output.txt
          rm -f .github/workflows/report-v37.yml .github/workflows/finalize-v37-docs.yml
      - name: Verify final paths and commit
        run: |
          git add -A
          git diff --cached --check origin/main
          git diff --cached --name-only origin/main -- | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          APPROVED_RULES.md
          LANGUAGE_CHECK.md
          README.md
          app-v28.js
          curriculum-v37.js
          index.html
          lesson13-v37.js
          lesson14-v37.js
          manifest-v37.webmanifest
          package-lock.json
          package.json
          styles-v28.css
          sw.js
          tests/dom-v30.cjs
          tests/validate-v30.mjs
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize v3.7 audit totals and cleanup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
