name: Report v3.7 validation totals

on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - '.v37report.ready'

permissions:
  contents: write

jobs:
  report:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v3.7-rc.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture exact validation totals
        run: |
          {
            npm run test:data
            npm run test:dom
          } > .v37test-output.txt 2>&1
          cat .v37test-output.txt
      - name: Commit report
        run: |
          rm -rf node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .v37test-output.txt
          git commit -m 'Capture v3.7 validation totals'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
