name: Snapshot v3.5 working tree

on:
  pull_request:
    types: [synchronize, reopened]
    branches:
      - main
    paths:
      - '.v35snapshot.trigger'

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v3.5-rc.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Build source snapshot
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.v35snapshot.trigger -czf /tmp/tamil2-v35-source.tar.gz .
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tamil2-v35-source
          path: /tmp/tamil2-v35-source.tar.gz
          if-no-files-found: error
