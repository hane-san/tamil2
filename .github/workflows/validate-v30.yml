name: Validate TN-SST v3

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run data validation and capture output
        id: data_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:data 2>&1 | tee data-test-output.log

      - name: Run DOM validation and capture output
        id: dom_test
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:dom 2>&1 | tee dom-test-output.log

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-test-output
          path: |
            data-test-output.log
            dom-test-output.log
          if-no-files-found: error

      - name: Enforce validation results
        if: steps.data_test.outcome == 'failure' || steps.dom_test.outcome == 'failure'
        run: exit 1
