name: Validate TN-SST v3

on:
  pull_request:
    paths:
      - 'textbook.html'
      - '*.js'
      - 'tests/validate-v30.mjs'
      - 'tests/dom-v30.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-v30.yml'
  push:
    branches: [main]
    paths:
      - 'textbook.html'
      - '*.js'
      - 'tests/validate-v30.mjs'
      - 'tests/dom-v30.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-v30.yml'

concurrency:
  group: validate-tn-sst-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare curriculum entry point for legacy validators
        run: cp textbook.html index.html

      - name: Run data validation
        run: npm run test:data

      - name: Run DOM validation
        run: npm run test:dom
