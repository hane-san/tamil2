name: Validate curriculum

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate public PART 0 and lessons 1–20
        run: npm run test:data
      - name: Validate one reading per word form
        run: npm run test:reading
      - name: Validate v4.9 practice pack
        run: npm run test:practice
      - name: Validate supplement A–H structure
        run: npm run test:supplements
      - name: Validate Japanese copy polish
        run: npm run test:copy
      - name: Validate supplement E
        run: npm run test:supplement-e
      - name: Validate supplement F
        run: npm run test:supplement-f
      - name: Validate supplement G
        run: npm run test:supplement-g
      - name: Validate supplement H
        run: npm run test:supplement-h
      - name: Validate isolated supplement progress model
        run: npm run test:supplement-ui
      - name: Validate integrated supplement preview
        run: npm run test:supplement-app
      - name: Validate existing DOM and audio behaviour
        run: npm run test:dom
