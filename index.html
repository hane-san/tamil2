<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d736f">
  <meta name="color-scheme" content="light">
  <title>口語タミル語の教科書</title>
  <meta name="description" content="地域横断型の標準口語タミル語を、文字・名詞・格・述語・動詞・否定・不定詞・動作連結・相・可能・必要・人称一致・命令・疑問・名詞句・比較・連体修飾・名詞化・引用・条件・理由・目的・時間を音と形態分解で学ぶスマートフォン教材。">
  <meta name="app-version" content="4.0-rc.1">
  <link rel="icon" type="image/png" href="app-icon.png">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="manifest" href="manifest-v40.webmanifest">
  <link rel="stylesheet" href="styles-v28.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ</a>

  <header class="app-header">
    <div class="brand-wrap">
      <button class="icon-button menu-button" id="menuButton" type="button" aria-label="課一覧を開く" aria-expanded="false" aria-controls="chapterDrawer">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">
        <span class="brand-kicker">STANDARD SPOKEN TAMIL · TN-SST</span>
        <strong><em>口語タミル語の教科書</em></strong>
      </div>
      <button class="icon-button settings-button" id="settingsButton" type="button" aria-label="表示設定を開く" aria-expanded="false" aria-controls="settingsPanel">Aa</button>
    </div>
    <div class="chapter-progress" aria-label="全体の進捗">
      <span id="progressLabel">第1課 / 20課</span>
      <span class="progress-track"><span id="progressFill"></span></span>
    </div>
  </header>

  <aside class="drawer" id="chapterDrawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <span class="eyebrow">CONTENTS</span>
        <h2>統合規格対応版 v4.0-rc.1・全20課</h2>
      </div>
      <button class="close-button" id="drawerClose" type="button" aria-label="課一覧を閉じる">×</button>
    </div>
    <section class="drawer-tools" aria-label="課を探す">
      <label class="chapter-search" for="chapterSearch">
        <span aria-hidden="true">⌕</span>
        <input id="chapterSearch" type="search" inputmode="search" autocomplete="off" placeholder="課名・文法・タミル語で検索">
      </label>
      <div class="drawer-progress-card">
        <div><strong id="drawerProgressText">0 / 20課 完了</strong><small id="drawerProgressDetail">学習ステップ 0 / 80</small></div>
        <span class="drawer-progress-track" aria-hidden="true"><span id="drawerProgressFill"></span></span>
      </div>
      <div class="drawer-quick-actions">
        <button id="resumeChapterButton" type="button">▶ 第1課から始める</button>
        <button id="incompleteFilterButton" type="button" aria-pressed="false">未完了だけ</button>
      </div>
      <div class="part-filter" id="partFilter" aria-label="部で絞り込む">
        <button type="button" data-part-filter="ALL" class="active" aria-pressed="true">全て</button>
        <button type="button" data-part-filter="PART I" aria-pressed="false">基礎</button>
      </div>
    </section>
    <nav id="chapterNav" aria-label="課一覧"></nav>
    <p class="chapter-nav-empty" id="chapterNavEmpty" hidden>条件に合う課がありません。検索語か絞り込みを変えてください。</p>
    <div class="drawer-note">
      <strong>現在の承認範囲：PART 0＋第1〜20課</strong>
      <p>旧38章は履歴として保持し、最新規格で再検証するまで公開教材の正本には使いません。</p>
    </div>
  </aside>
  <button class="scrim" id="drawerScrim" type="button" aria-label="課一覧を閉じる" hidden></button>

  <section class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-head">
      <div>
        <span class="eyebrow">DISPLAY</span>
        <h2>読み方の設定</h2>
      </div>
      <button class="close-button" id="settingsClose" type="button" aria-label="設定を閉じる">×</button>
    </div>
    <label class="toggle-row">
      <span><strong>カナ</strong><small>想起と音読の補助</small></span>
      <input id="toggleKana" type="checkbox" checked>
      <span class="toggle-ui" aria-hidden="true"></span>
    </label>
    <label class="toggle-row">
      <span><strong>直訳</strong><small>タミル語の組み方を見る</small></span>
      <input id="toggleLiteral" type="checkbox" checked>
      <span class="toggle-ui" aria-hidden="true"></span>
    </label>
    <label class="toggle-row">
      <span><strong>語の切れ目</strong><small>ローマ字の形態素ハイフン</small></span>
      <input id="toggleMorph" type="checkbox" checked>
      <span class="toggle-ui" aria-hidden="true"></span>
    </label>
    <div class="settings-actions">
      <button class="soft-button" id="printChapterButton" type="button">この課を印刷</button>
      <button class="soft-button" id="printBookButton" type="button">PART 0＋全20課を印刷</button>
      <button class="text-button danger-text" id="resetProgressButton" type="button">学習記録をリセット</button>
    </div>
  </section>

  <main id="main" tabindex="-1">
    <article id="lesson" class="lesson" aria-live="polite"></article>
  </main>

  <nav class="bottom-nav" aria-label="課内メニュー">
    <button type="button" data-view="read" class="active"><span>01</span>読む</button>
    <button type="button" data-view="examples"><span>02</span>例文</button>
    <button type="button" data-view="forms"><span>03</span>形</button>
    <button type="button" data-view="practice"><span>04</span>練習</button>
  </nav>

  <section class="audio-dock" id="audioDock" aria-label="音声プレーヤー" aria-hidden="true">
    <div class="now-playing">
      <span class="audio-label">NOW PLAYING</span>
      <strong id="audioTamil" lang="ta">—</strong>
      <small id="audioJapanese">例文カードをタップしてください</small>
    </div>
    <div class="audio-controls">
      <button id="audioPrev" type="button" aria-label="前の例文">‹</button>
      <button id="audioPlay" class="audio-main" type="button" aria-label="再生・一時停止">▶</button>
      <button id="audioNext" type="button" aria-label="次の例文">›</button>
      <button id="audioStop" type="button" aria-label="停止">■</button>
      <button id="audioSpeed" class="audio-chip" type="button" aria-label="再生速度">1.0×</button>
      <button id="audioRepeat" class="audio-chip" type="button" aria-label="繰り返し回数">×1</button>
      <button id="audioClose" type="button" aria-label="プレーヤーを閉じる">×</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="printBook" class="print-book" aria-hidden="true"></div>

  <script src="tamil-core-v30.js"></script>
  <script src="reference-v30.js"></script>
  <script src="lesson01-v30.js"></script>
  <script src="lesson02-v30.js"></script>
  <script src="lesson03-v31.js"></script>
  <script src="lesson04-v31.js"></script>
  <script src="lesson05-v32.js"></script>
  <script src="lesson06-v32.js"></script>
  <script src="lesson07-v33.js"></script>
  <script src="lesson08-v33.js"></script>
  <script src="lesson09-v35.js"></script>
  <script src="lesson10-v35.js"></script>
  <script src="lesson11-v36.js"></script>
  <script src="lesson12-v36.js"></script>
  <script src="lesson13-v37.js"></script>
  <script src="lesson14-v37.js"></script>
  <script src="lesson15-v38.js"></script>
  <script src="lesson16-v38.js"></script>
  <script src="lesson17-v39.js"></script>
  <script src="lesson18-v39.js"></script>
  <script src="lesson19-v40.js"></script>
  <script src="lesson20-v40.js"></script>
  <script src="reading-v31.js"></script>
  <script src="pedagogy-v34.js"></script>
  <script src="curriculum-v40.js"></script>
  <script src="app-v28.js"></script>
</body>
</html>
